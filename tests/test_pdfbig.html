<!doctype html><meta charset="utf-8"><pre id="log">RUNNING</pre>
<script src="../segment.js"></script><script src="../zip.js"></script>
<script src="../pdfdoc.js"></script><script src="../parse.js"></script>
<script>
(async function(){
  var L=[]; const say=s=>{L.push(String(s));document.getElementById('log').textContent=L.join('\n');};
  RD.pdfdoc.BASE='../';
  for (const name of ['long_zh','scan_big']) {
    const t0=Date.now();
    try{
      const buf=await (await fetch('fixtures/'+name+'.pdf')).arrayBuffer();
      const r=await RD.parse.parseFile(name+'.pdf', buf);
      const secs=((Date.now()-t0)/1000).toFixed(1);
      if(r.format==='pdf-image') say(name+': 掃描書 '+r.pageCount+' 頁, '+secs+'s');
      else say(name+': 文字型 blocks='+r.doc.blocks.length+' chapters='+r.doc.chapters.length
               +' chars='+r.doc.totalChars+', '+secs+'s');
      say('  原始 buffer 還能用: '+(buf.byteLength>0));
    }catch(e){ say(name+' ERR '+(e&&e.message)); }
  }
  say('DONE');
})();
</script>
